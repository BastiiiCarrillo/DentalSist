trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-24.04'

variables:
  NODE_VERSION: '20.x'

stages:
- stage: BuildAndTest
  displayName: 'Fase de Compilacion y Pruebas Unitarias'
  jobs:
  - job: BackendCI
    displayName: 'Ejecutar Build y Pruebas Backend'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(NODE_VERSION)'
      displayName: 'Instalar Node.js $(NODE_VERSION)'
    - script: |
        cd backend
        npm install
        npm run build
      displayName: 'Instalar Dependencias y Compilar'
    - script: |
        cd backend
        npm audit --audit-level=high
      displayName: 'Auditoria de Seguridad de Dependencias'

    - script: |
        cd backend
        node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml
      displayName: 'Ejecutar Pruebas Unitarias'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend/test-results.xml'
        testRunTitle: 'Pruebas Unitarias DentalSist'
      displayName: 'Publicar Resultados de Pruebas'
